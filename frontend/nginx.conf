server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: todas las rutas no-archivo vuelven al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend FastAPI dentro de la red Docker
    location /api/ {
        proxy_pass         http://guardian_api:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # Reenvía las cookies (esencial para el JWT en httpOnly cookie)
        proxy_pass_header  Set-Cookie;
    }
}
