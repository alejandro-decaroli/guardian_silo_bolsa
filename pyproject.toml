[project]
name = "guardian-silo-bolsa"
version = "1.10.1"
description = "Herramienta de monitoreo y alerta enfocada en el deterioro de granos en silo bolsas"
authors = [
    {name = "Alejandro",email = "alejandro.decaroli.97@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "influxdb3-python (>=0.17.0,<0.18.0)",
    "sqlmodel (>=0.0.31,<0.0.32)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pyjwt (>=2.11.0,<3.0.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)"
]

[tool.poetry]
packages = [{include = "guardian_silo_bolsa", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
